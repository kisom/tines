[package]
name = "tines-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Opportunistic shared memory for mostly-offline robots: a no_std core of content-addressed observations, gossip, and store-and-forward exchange."
authors.workspace = true
repository.workspace = true
readme.workspace = true
documentation = "https://docs.rs/tines-core"
keywords = ["robotics", "gossip", "delay-tolerant", "no-std", "sync"]
categories = ["no-std", "embedded", "network-programming", "science::robotics"]

[features]
default = ["alloc"]
alloc = []
# A `no_std`-clean conformance suite ([`store_conformance`]) that concrete
# backends run against themselves to prove they honor the `Store` contract.
# Std-free so it builds with `--no-default-features`; enabled only by the
# backend crates that exercise the suite (MemStore, LogStore, CappedStore).
conformance = []

[dependencies]
heapless = { version = "0.8", features = ["serde"] }
serde = { version = "1", default-features = false, features = ["derive"] }
postcard = { version = "1", default-features = false }
blake2 = { version = "0.10", default-features = false }
